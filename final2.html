<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Position Task</title>

<style>
    body {
        height: 3000px;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    
    .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: black;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        cursor: pointer;
    }

    .fixed-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 320px;
        height: 180px;
        background: lightgray;
    }

    .product {
        position: relative;
        display: inline-block;
        margin-top: 100px;
        border: 1px solid #ccc;
        padding: 10px;
    }

    .product img {
        width: 250px;
        height: auto;
        display: block;
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: black;
        color: white;
        padding: 5px 10px;
        font-size: 14px;
    }

    .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 60px;
        background: rgba(255,255,255,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .overlay button {
        padding: 8px 15px;
        cursor: pointer;
    }
</style>

</head>
<body>

<div class="close-btn">X</div>

<div class="fixed-box"></div>


<div class="product">
    <img src="dam.png" alt="Clothing">

    <div class="badge">20% OFF</div>

    <div class="overlay">
        <button>Add to Cart</button>
    </div>
</div>

</body>
</html>
